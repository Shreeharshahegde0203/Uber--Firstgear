databases:
  - name: uber-firstgear-db
    databaseName: uberfirstgear
    user: uber_user
    plan: free

services:
  - type: web
    name: uber-firstgear
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uber-firstgear-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
