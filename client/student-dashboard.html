<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | Uber First Gear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Navigation */
        .nav {
            background: #000;
            border-bottom: 1px solid #1a1a1a;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .nav-brand {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 4px;
        }

        .nav-link {
            padding: 20px 24px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .nav-link:hover {
            color: #888;
        }

        .nav-link.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
        }

        .status-indicator.connected .status-dot {
            background: #22c55e;
        }

        .status-indicator.connected {
            color: #888;
        }

        /* Professional Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .animate-fade-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .animate-slide-in {
            animation: slideInRight 0.4s ease-out forwards;
        }

        .delay-1 { animation-delay: 0.1s; opacity: 0; }
        .delay-2 { animation-delay: 0.2s; opacity: 0; }
        .delay-3 { animation-delay: 0.3s; opacity: 0; }
        .delay-4 { animation-delay: 0.4s; opacity: 0; }

        .btn-book {
            padding: 10px 20px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-book:hover {
            background: #e5e5e5;
        }

        /* Main Container */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Page Header */
        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            color: #666;
            font-size: 15px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border-bottom: 1px solid #1a1a1a;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #666;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #888;
        }

        .tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        .tab-count {
            background: #222;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 8px;
        }

        /* Booking Cards */
        .bookings-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .booking-card {
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.2s;
        }

        .booking-card:hover {
            border-color: #333;
        }

        .booking-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .booking-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .booking-meta {
            font-size: 13px;
            color: #666;
        }

        .booking-status {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .booking-status.bidding {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .booking-status.pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .booking-status.confirmed {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .booking-status.in-progress {
            background: rgba(139, 92, 246, 0.15);
            color: #8b5cf6;
        }

        .booking-status.completed {
            background: rgba(107, 114, 128, 0.15);
            color: #6b7280;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1a1a1a;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .detail-value {
            font-size: 14px;
            color: #fff;
            font-weight: 500;
        }

        .booking-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: #fff;
            color: #000;
        }

        .btn-primary:hover {
            background: #e5e5e5;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #333;
            color: #888;
        }

        .btn-secondary:hover {
            border-color: #555;
            color: #fff;
        }

        /* Bid Progress */
        .bid-progress {
            margin-top: 16px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .progress-label {
            font-size: 12px;
            color: #666;
        }

        .progress-value {
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }

        .progress-bar {
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #3b82f6;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-icon svg {
            width: 32px;
            height: 32px;
            stroke: #333;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            color: #888;
            margin-bottom: 8px;
        }

        .empty-text {
            font-size: 14px;
            color: #555;
            margin-bottom: 24px;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #222;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 16px 20px;
            max-width: 360px;
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .toast-title {
            font-size: 14px;
            font-weight: 600;
        }

        .toast-close {
            background: none;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
        }

        .toast-body {
            font-size: 13px;
            color: #888;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .booking-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .nav-links {
                display: none;
            }

            .stats-row {
                grid-template-columns: 1fr 1fr;
            }

            .booking-details {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
            }

            .tab {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-content">
            <a href="index.html" class="nav-brand">Uber First Gear</a>
            <div class="nav-links">
                <a href="student-book-lesson.html" class="nav-link">Book Lesson</a>
                <a href="student-dashboard.html" class="nav-link active">My Bookings</a>
                <a href="student-quiz.html" class="nav-link">Daily Quiz</a>
            </div>
            <div class="nav-right">
                <div class="status-indicator" id="wsStatus">
                    <span class="status-dot"></span>
                    <span id="wsStatusText">Connecting</span>
                </div>
                <a href="student-book-lesson.html" class="btn-book">New Booking</a>
            </div>
        </div>
    </nav>

    <main class="main">
        <div class="page-header">
            <h1 class="page-title">My Bookings</h1>
            <p class="page-subtitle">Track and manage your driving lesson bookings</p>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Active</div>
                <div class="stat-value" id="statActive">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="statPending">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="statCompleted">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Hours</div>
                <div class="stat-value" id="statHours">0</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('all')" data-tab="all">
                All<span class="tab-count" id="countAll">0</span>
            </button>
            <button class="tab" onclick="switchTab('bidding')" data-tab="bidding">
                Bidding<span class="tab-count" id="countBidding">0</span>
            </button>
            <button class="tab" onclick="switchTab('pending')" data-tab="pending">
                Pending<span class="tab-count" id="countPending">0</span>
            </button>
            <button class="tab" onclick="switchTab('confirmed')" data-tab="confirmed">
                Confirmed<span class="tab-count" id="countConfirmed">0</span>
            </button>
            <button class="tab" onclick="switchTab('in-progress')" data-tab="in-progress">
                In Progress<span class="tab-count" id="countInProgress">0</span>
            </button>
            <button class="tab" onclick="switchTab('completed')" data-tab="completed">
                Completed<span class="tab-count" id="countCompleted">0</span>
            </button>
        </div>

        <div id="loadingState" class="loading">
            <div class="spinner"></div>
            <p>Loading bookings...</p>
        </div>

        <div id="bookingsContainer" class="bookings-list"></div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <path d="M16 2v4M8 2v4M3 10h18"/>
                </svg>
            </div>
            <div class="empty-title">No bookings yet</div>
            <div class="empty-text">Book your first driving lesson to get started</div>
            <a href="student-book-lesson.html" class="btn btn-primary">Book a Lesson</a>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const API_URL = window.CONFIG?.API_URL || 'http://localhost:8000';
        let ws = null;
        let currentUser = JSON.parse(localStorage.getItem('user')) || { id: 1 };
        let allBookings = [];
        let currentTab = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            connectWebSocket();
            loadBookings();
        });

        function connectWebSocket() {
            const wsUrl = `ws://localhost:8000/ws/notifications/${currentUser.id}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => updateWSStatus(true);
            ws.onclose = () => {
                updateWSStatus(false);
                setTimeout(connectWebSocket, 5000);
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleNotification(data);
            };
        }

        function updateWSStatus(connected) {
            const status = document.getElementById('wsStatus');
            const text = document.getElementById('wsStatusText');
            
            if (connected) {
                status.classList.add('connected');
                text.textContent = 'Live';
            } else {
                status.classList.remove('connected');
                text.textContent = 'Offline';
            }
        }

        function handleNotification(data) {
            console.log('Notification received:', data);
            
            if (data.type === 'new_bid_received') {
                showToast('New Bid', data.message || `New bid of ₹${data.bid_amount} received`);
                loadBookings();
            } else if (data.type === 'lesson_confirmed') {
                showToast('Confirmed', 'Your lesson has been confirmed by the instructor');
                loadBookings();
            } else if (data.type === 'lesson_started') {
                showToast('Started', 'Your lesson has started');
                loadBookings();
            } else if (data.type === 'lesson_completed') {
                showToast('Completed', 'Your lesson is complete. Please rate your instructor.');
                loadBookings();
            } else {
                showToast('Update', 'Booking status updated');
                loadBookings();
            }
        }

        function showToast(title, message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div class="toast-header">
                    <span class="toast-title">${title}</span>
                    <button class="toast-close" onclick="this.closest('.toast').remove()">&times;</button>
                </div>
                <div class="toast-body">${message}</div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        async function loadBookings() {
            try {
                const response = await fetch(`${API_URL}/api/lessons/student/${currentUser.id}`);
                const data = await response.json();

                console.log('API Response:', data);
                allBookings = data.bookings || [];
                console.log('Bookings loaded:', allBookings.length, 'bookings');
                allBookings.forEach(b => console.log(`Booking #${b.booking_id}: status="${b.status}" total_bids=${b.total_bids}`));
                
                document.getElementById('loadingState').style.display = 'none';

                updateCounts();
                displayBookings();

            } catch (error) {
                console.error('Error loading bookings:', error);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                document.querySelector('.empty-title').textContent = 'Failed to load';
                document.querySelector('.empty-text').textContent = 'Please check your connection';
            }
        }

        function updateCounts() {
            const statusMap = {
                'bidding_open': 'bidding',
                'BIDDING_OPEN': 'bidding',
                'tutor_selected': 'pending',
                'TUTOR_SELECTED': 'pending',
                'confirmed': 'confirmed',
                'CONFIRMED': 'confirmed',
                'in_progress': 'in-progress',
                'IN_PROGRESS': 'in-progress',
                'completed': 'completed',
                'COMPLETED': 'completed'
            };

            const counts = {
                all: allBookings.length,
                bidding: 0,
                pending: 0,
                confirmed: 0,
                'in-progress': 0,
                completed: 0
            };

            allBookings.forEach(b => {
                const tab = statusMap[b.status];
                if (tab) counts[tab]++;
            });

            document.getElementById('countAll').textContent = counts.all;
            document.getElementById('countBidding').textContent = counts.bidding;
            document.getElementById('countPending').textContent = counts.pending;
            document.getElementById('countConfirmed').textContent = counts.confirmed;
            document.getElementById('countInProgress').textContent = counts['in-progress'];
            document.getElementById('countCompleted').textContent = counts.completed;

            // Update stats
            document.getElementById('statActive').textContent = counts.confirmed + counts['in-progress'];
            document.getElementById('statPending').textContent = counts.bidding + counts.pending;
            document.getElementById('statCompleted').textContent = counts.completed;

            const totalHours = allBookings
                .filter(b => b.status === 'COMPLETED' || b.status === 'completed')
                .reduce((sum, b) => sum + (b.duration_hours || 0), 0);
            document.getElementById('statHours').textContent = totalHours;
        }

        function switchTab(tab) {
            currentTab = tab;
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

            displayBookings();
        }

        function displayBookings() {
            const container = document.getElementById('bookingsContainer');
            const emptyState = document.getElementById('emptyState');

            const statusMap = {
                'bidding_open': 'bidding',
                'BIDDING_OPEN': 'bidding',
                'tutor_selected': 'pending',
                'TUTOR_SELECTED': 'pending',
                'confirmed': 'confirmed',
                'CONFIRMED': 'confirmed',
                'in_progress': 'in-progress',
                'IN_PROGRESS': 'in-progress',
                'completed': 'completed',
                'COMPLETED': 'completed'
            };

            let filtered = allBookings;
            if (currentTab !== 'all') {
                filtered = allBookings.filter(b => statusMap[b.status] === currentTab);
            }

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = filtered.map(booking => createBookingCard(booking)).join('');
        }

        function createBookingCard(booking) {
            const statusMap = {
                'bidding_open': { class: 'bidding', text: 'Bidding Open' },
                'BIDDING_OPEN': { class: 'bidding', text: 'Bidding Open' },
                'tutor_selected': { class: 'pending', text: 'Pending Confirmation' },
                'TUTOR_SELECTED': { class: 'pending', text: 'Pending Confirmation' },
                'confirmed': { class: 'confirmed', text: 'Confirmed' },
                'CONFIRMED': { class: 'confirmed', text: 'Confirmed' },
                'in_progress': { class: 'in-progress', text: 'In Progress' },
                'IN_PROGRESS': { class: 'in-progress', text: 'In Progress' },
                'completed': { class: 'completed', text: 'Completed' },
                'COMPLETED': { class: 'completed', text: 'Completed' }
            };

            const status = statusMap[booking.status] || { class: '', text: booking.status };
            const isBidding = booking.status === 'bidding_open' || booking.status === 'BIDDING_OPEN';

            let actions = '';
            if (isBidding) {
                actions = `
                    <a href="student-bidding.html?booking_id=${booking.booking_id}" class="btn btn-primary">View Bids (${booking.total_bids || 0})</a>
                `;
            }

            let bidProgress = '';
            if (isBidding) {
                const bidPct = Math.min((booking.total_bids || 0) * 20, 100);
                bidProgress = `
                    <div class="bid-progress">
                        <div class="progress-header">
                            <span class="progress-label">Bids received</span>
                            <span class="progress-value">${booking.total_bids || 0} bids</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${bidPct}%"></div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="booking-card">
                    <div class="booking-top">
                        <div class="booking-info">
                            <h3>${formatLessonType(booking.lesson_type)}</h3>
                            <div class="booking-meta">Booking #${booking.booking_id}</div>
                        </div>
                        <span class="booking-status ${status.class}">${status.text}</span>
                    </div>
                    <div class="booking-details">
                        <div class="detail-item">
                            <span class="detail-label">Date</span>
                            <span class="detail-value">${formatDate(booking.lesson_date)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Time</span>
                            <span class="detail-value">${booking.start_time} - ${booking.end_time}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Duration</span>
                            <span class="detail-value">${booking.duration_hours} hours</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Location</span>
                            <span class="detail-value">${booking.pickup_location}</span>
                        </div>
                    </div>
                    ${bidProgress}
                    ${actions ? `<div class="booking-actions">${actions}</div>` : ''}
                </div>
            `;
        }

        function formatLessonType(type) {
            const types = {
                'beginner': 'Beginner Training',
                'intermediate': 'Intermediate Course',
                'advanced': 'Advanced Skills',
                'test_prep': 'License Test Prep',
                'highway': 'Highway Driving',
                'parking': 'Parking Skills',
                'defensive_driving': 'Defensive Driving'
            };
            return types[type] || type;
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
        }
    </script>
</body>
</html>
