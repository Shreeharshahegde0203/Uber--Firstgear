<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Lessons | FirstGear Instructor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Navigation */
        .nav {
            background: #000;
            border-bottom: 1px solid #1a1a1a;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .nav-brand {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }

        .nav-center {
            display: flex;
            gap: 4px;
        }

        .nav-tab {
            padding: 20px 24px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: #888;
        }

        .nav-tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
        }

        .status-indicator.connected .status-dot {
            background: #22c55e;
        }

        .status-indicator.connected {
            color: #888;
        }

        /* Professional Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-fade-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .animate-slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }

        .delay-1 { animation-delay: 0.1s; opacity: 0; }
        .delay-2 { animation-delay: 0.2s; opacity: 0; }
        .delay-3 { animation-delay: 0.3s; opacity: 0; }
        .delay-4 { animation-delay: 0.4s; opacity: 0; }

        .pending-badge {
            padding: 8px 16px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .pending-badge:hover {
            background: #27272a;
        }

        .pending-count {
            background: #ef4444;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Main Container */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Page Header */
        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            color: #666;
            font-size: 15px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        /* Filters */
        .filters-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #1a1a1a;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        .filter-pills {
            display: flex;
            gap: 8px;
        }

        .filter-pill {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #333;
            color: #888;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-pill:hover {
            border-color: #555;
            color: #fff;
        }

        .filter-pill.active {
            background: #fff;
            border-color: #fff;
            color: #000;
        }

        /* Lessons Grid */
        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lesson-row {
            display: grid;
            grid-template-columns: 1fr 140px 120px 100px 100px 120px;
            align-items: center;
            gap: 16px;
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 20px 24px;
            transition: all 0.3s ease;
        }

        .lesson-row:hover {
            transform: translateX(8px);
            border-color: #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .lesson-row:hover {
            border-color: #333;
            background: #151515;
        }

        .lesson-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lesson-type {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        .lesson-location {
            font-size: 13px;
            color: #666;
        }

        .lesson-date {
            font-size: 14px;
            color: #888;
        }

        .lesson-duration {
            font-size: 14px;
            color: #888;
        }

        .lesson-bids {
            font-size: 14px;
            color: #666;
        }

        .lesson-time-left {
            font-size: 13px;
            color: #f59e0b;
            font-weight: 500;
        }

        .lesson-time-left.urgent {
            color: #ef4444;
        }

        .btn-bid {
            padding: 10px 20px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-bid:hover {
            background: #e5e5e5;
        }

        .btn-bid:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .btn-bid.placed {
            background: transparent;
            border: 1px solid #22c55e;
            color: #22c55e;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-icon svg {
            width: 32px;
            height: 32px;
            stroke: #333;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            color: #888;
            margin-bottom: 8px;
        }

        .empty-text {
            font-size: 14px;
            color: #555;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #222;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Table Header */
        .table-header {
            display: grid;
            grid-template-columns: 1fr 140px 120px 100px 100px 120px;
            gap: 16px;
            padding: 0 24px 16px;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 12px;
        }

        .table-header span {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 16px 20px;
            max-width: 360px;
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .toast-title {
            font-size: 14px;
            font-weight: 600;
        }

        .toast-close {
            background: none;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
        }

        .toast-body {
            font-size: 13px;
            color: #888;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .lesson-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .table-header {
                display: none;
            }

            .lesson-row > * {
                display: flex;
                justify-content: space-between;
            }

            .lesson-row > *::before {
                color: #555;
                font-size: 12px;
            }
        }

        @media (max-width: 640px) {
            .nav-center {
                display: none;
            }

            .stats-row {
                grid-template-columns: 1fr 1fr;
            }

            .filter-pills {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-content">
            <a href="driver.html" class="nav-brand">FirstGear</a>
            <div class="nav-center">
                <a href="tutor-dashboard.html" class="nav-tab active">Browse</a>
                <a href="tutor-my-lessons.html" class="nav-tab">My Lessons</a>
                <a href="tutor-quiz.html" class="nav-tab">Daily Quiz</a>
            </div>
            <div class="nav-right">
                <div class="status-indicator" id="wsStatus">
                    <span class="status-dot"></span>
                    <span id="wsStatusText">Connecting</span>
                </div>
                <a href="tutor-my-lessons.html" class="pending-badge" id="pendingLink" style="display: none;">
                    Pending
                    <span class="pending-count" id="pendingCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="main">
        <div class="page-header">
            <h1 class="page-title">Available Lessons</h1>
            <p class="page-subtitle">Browse and bid on driving lesson requests near you</p>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Available</div>
                <div class="stat-value" id="statAvailable">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Your Bids</div>
                <div class="stat-value" id="statMyBids">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Won This Week</div>
                <div class="stat-value" id="statWon">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Earnings</div>
                <div class="stat-value" id="statEarnings">Rs 0</div>
            </div>
        </div>

        <div class="filters-bar">
            <h2 class="section-title">Open Requests</h2>
            <div class="filter-pills">
                <button class="filter-pill active" onclick="filterLessons('all')">All</button>
                <button class="filter-pill" onclick="filterLessons('nearby')">Nearby</button>
                <button class="filter-pill" onclick="filterLessons('beginner')">Beginner</button>
                <button class="filter-pill" onclick="filterLessons('test_prep')">Test Prep</button>
            </div>
        </div>

        <div class="table-header">
            <span>Lesson</span>
            <span>Date</span>
            <span>Duration</span>
            <span>Bids</span>
            <span>Time Left</span>
            <span></span>
        </div>

        <div id="lessonsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading lessons...</p>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const API_URL = window.CONFIG?.API_URL || 'http://localhost:8000';
        let ws = null;
        let currentUser = null;
        let currentTutor = null;
        let allLessons = [];
        let currentFilter = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await initializeTutor();
            if (currentTutor && currentTutor.id) {
                connectWebSocket();
                loadAvailableLessons();
                loadPendingCount();
                setInterval(loadAvailableLessons, 30000);
            }
        });

        // Get tutor profile from user
        async function initializeTutor() {
            currentUser = JSON.parse(localStorage.getItem('user'));
            if (!currentUser || !currentUser.id) {
                alert('Please login to access instructor dashboard');
                window.location.href = 'driver-login.html';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/tutors/user/${currentUser.id}`);
                const data = await response.json();
                
                if (!data.is_tutor) {
                    alert('You need to register as an instructor first');
                    window.location.href = 'tutor-register.html';
                    return;
                }

                currentTutor = data.tutor;
                localStorage.setItem('tutor', JSON.stringify(currentTutor));
                localStorage.setItem('tutorData', JSON.stringify(currentTutor));
            } catch (error) {
                console.error('Error fetching tutor profile:', error);
                // Try to use cached tutor data
                currentTutor = JSON.parse(localStorage.getItem('tutor')) || JSON.parse(localStorage.getItem('tutorData'));
                if (!currentTutor) {
                    alert('Failed to load instructor profile');
                    window.location.href = 'driver.html';
                }
            }
        }

        // WebSocket Connection
        function connectWebSocket() {
            if (!currentUser || !currentUser.id) return;
            
            const wsUrl = `ws://localhost:8000/ws/notifications/${currentUser.id}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateWSStatus(true);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleNotification(data);
            };

            ws.onclose = () => {
                updateWSStatus(false);
                setTimeout(connectWebSocket, 5000);
            };

            ws.onerror = () => {};
        }

        function updateWSStatus(connected) {
            const status = document.getElementById('wsStatus');
            const text = document.getElementById('wsStatusText');
            
            if (connected) {
                status.classList.add('connected');
                text.textContent = 'Live';
            } else {
                status.classList.remove('connected');
                text.textContent = 'Offline';
            }
        }

        function handleNotification(data) {
            console.log('Notification received:', data);
            
            if (data.type === 'new_lesson_request') {
                showToast('New Lesson', `${formatLessonType(data.lesson_type)} lesson available`);
                loadAvailableLessons();
            } else if (data.type === 'tutor_selected' || data.type === 'lesson_selected') {
                showToast('You Were Selected!', data.message || 'A student selected you for a lesson');
                loadPendingCount();
            } else if (data.type === 'bid_rejected') {
                showToast('Bid Not Selected', data.message || 'Another instructor was selected');
                loadAvailableLessons();
            } else if (data.type === 'lesson_confirmed') {
                showToast('Lesson Confirmed', 'Payment received and lesson confirmed!');
                loadPendingCount();
            }
        }

        function showToast(title, message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div class="toast-header">
                    <span class="toast-title">${title}</span>
                    <button class="toast-close" onclick="this.closest('.toast').remove()">&times;</button>
                </div>
                <div class="toast-body">${message}</div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        async function loadPendingCount() {
            try {
                const response = await fetch(`${API_URL}/api/lessons/pending-acceptance/${currentTutor.id}`);
                const data = await response.json();
                const count = data.pending_lessons?.length || 0;
                
                const link = document.getElementById('pendingLink');
                const countEl = document.getElementById('pendingCount');
                
                if (count > 0) {
                    link.style.display = 'flex';
                    countEl.textContent = count;
                } else {
                    link.style.display = 'none';
                }
            } catch (error) {}
        }

        async function loadAvailableLessons() {
            try {
                const tutorLat = 12.9716;
                const tutorLng = 77.5946;

                const response = await fetch(
                    `${API_URL}/api/lessons/available?tutor_id=${currentTutor.id}&tutor_lat=${tutorLat}&tutor_lng=${tutorLng}&max_distance_km=50`
                );
                const data = await response.json();

                allLessons = data.available_lessons || [];
                
                document.getElementById('statAvailable').textContent = allLessons.length;
                document.getElementById('statMyBids').textContent = allLessons.filter(l => l.already_bid).length;

                displayLessons();
            } catch (error) {
                showError();
            }
        }

        function displayLessons() {
            const container = document.getElementById('lessonsContainer');
            
            let filteredLessons = allLessons;
            
            if (currentFilter === 'nearby') {
                filteredLessons = allLessons.filter(l => l.distance_km && l.distance_km <= 5);
            } else if (currentFilter !== 'all') {
                filteredLessons = allLessons.filter(l => l.lesson_type === currentFilter);
            }

            if (filteredLessons.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M12 6v6l4 2M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                            </svg>
                        </div>
                        <div class="empty-title">No lessons available</div>
                        <div class="empty-text">Check back soon for new opportunities</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="lessons-list">
                    ${filteredLessons.map(lesson => createLessonRow(lesson)).join('')}
                </div>
            `;
        }

        function createLessonRow(lesson) {
            const isUrgent = lesson.time_remaining_minutes < 10;
            const distanceText = lesson.distance_km ? `${lesson.distance_km} km` : '';

            return `
                <div class="lesson-row">
                    <div class="lesson-main">
                        <span class="lesson-type">${formatLessonType(lesson.lesson_type)}</span>
                        <span class="lesson-location">${lesson.pickup_location}${distanceText ? ' · ' + distanceText : ''}</span>
                    </div>
                    <span class="lesson-date">${formatDate(lesson.lesson_date)} ${lesson.start_time}</span>
                    <span class="lesson-duration">${lesson.duration_hours} hrs</span>
                    <span class="lesson-bids">${lesson.total_bids} bids</span>
                    <span class="lesson-time-left ${isUrgent ? 'urgent' : ''}">${lesson.time_remaining_minutes}m left</span>
                    <button class="btn-bid ${lesson.already_bid ? 'placed' : ''}" 
                        ${lesson.already_bid ? 'disabled' : ''} 
                        onclick="placeBid(${lesson.booking_id})">
                        ${lesson.already_bid ? 'Bid Placed' : 'Place Bid'}
                    </button>
                </div>
            `;
        }

        function filterLessons(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-pill').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            displayLessons();
        }

        function placeBid(bookingId) {
            window.location.href = `tutor-place-bid.html?booking_id=${bookingId}`;
        }

        function formatLessonType(type) {
            const types = {
                'beginner': 'Beginner Training',
                'intermediate': 'Intermediate Course',
                'advanced': 'Advanced Skills',
                'test_prep': 'License Test Prep',
                'highway': 'Highway Driving',
                'parking': 'Parking Skills',
                'defensive_driving': 'Defensive Driving'
            };
            return types[type] || type;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function showError() {
            const container = document.getElementById('lessonsContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 9v2m0 4h.01M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                        </svg>
                    </div>
                    <div class="empty-title">Failed to load lessons</div>
                    <div class="empty-text">Please check your connection and try again</div>
                </div>
            `;
        }
    </script>
</body>
</html>
